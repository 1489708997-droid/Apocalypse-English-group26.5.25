<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习打卡系统</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 15px; }

        select { padding: 8px; border-radius: 8px; border: 1px solid #ccc; flex: 1; font-size: 0.9rem; }
        .card-wrap { width: 100%; max-width: 400px; height: 280px; perspective: 1000px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }

        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: white; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; text-align: center; }
        .back { transform: rotateY(180deg); color: #d35400; font-size: 1.1rem; }
        .btns { margin-top: 20px; display: flex; gap: 15px; }
        button { padding: 10px 25px; border: none; border-radius: 20px; background: #4a90e2; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="nav">

    <select id="dateSelect" onchange="render()">

</div>

<div class="card-wrap" onclick="document.querySelector('.card').classList.toggle('flipped')">

            <div id="front-cn" style="color: #666; margin-top: 10px;"></div>
        </div>
        <div class="face back">
            <div id="back-text"></div>
        </div>
    </div>
</div>

<div class="btns">
    <button onclick="playAudio()">🔊 朗读</button>
    <button onclick="next()">下一条</button>
</div>

        {date:"07/13", type:"sentence", f:"We followed the itinerary to do sightseeing at the landmark.", c:"我们按照行程，去目的地附近的地标观光。", b:"/wi ˈfɒləʊd/"}, {date:"07/13", type:"sentence", f:"I packed all my luggage into my backpack for this short excursion.", c:"我把所有行李装进背包，准备这次短途出游。", b:"/aɪ pækt/"}, {date:"07/13", type:"sentence", f:"We booked comfortable accommodation close to the main landmark.", c:"我们在主地标附近预订了舒适的住宿。", b:"/wi bʊkt/"}, {date:"07/13", type:"sentence", f:"This handmade souvenir is the best gift.", c:"这件手工纪念品是我们短途出游收获的最好礼物。", b:"/ðɪs ˈhændmeɪd/"}, {date:"07/13", type:"sentence", f:"Our excursion includes sightseeing and picking local souvenirs.", c:"我们的短途出游包含观光和选购当地纪念品。", b:"/ˈaʊə(r) ɪkˈskɜːʃn/"},
        {date:"07/14", type:"sentence", f:"Your judgment on this matter seems rather one-sided.", c:"你在这件事上的判断未免太过片面了。", b:"/jɔː(r) ˈdʒʌdʒmənt/"}, {date:"07/14", type:"sentence", f:"It’s inappropriate to shift your own responsibilities onto others.", c:"随意把自己的职责推卸给别人是不妥当的。", b:"/ɪts ˌɪnəˈprəʊpriət/"}, {date:"07/14", type:"sentence", f:"Your suggestion lacks practical consideration.", c:"你的提议没有结合整体项目进度做实际考量。", b:"/jɔː(r) səˈdʒestʃn/"}, {date:"07/14", type:"sentence", f:"Criticizing results without understanding the whole process is not objective.", c:"不了解完整过程就评判结果，并不客观。", b:"/ˈkrɪtɪsaɪzɪŋ/"}, {date:"07/14", type:"sentence", f:"I’d appreciate it if you could communicate your opinions in a more rational way.", c:"如果你能用更理性的方式表达观点，我会很受用。", b:"/aɪd əˈpriːʃieɪt/"},
        {date:"07/15", type:"sentence", f:"Your work efficiency is far below the required standard.", c:"你的工作效率远达不到团队规定的标准。", b:"/jɔː(r) wɜːk ɪˈfɪʃnsi/"}, {date:"07/15", type:"sentence", f:"You have repeatedly made careless mistakes.", c:"你屡次犯下粗心的失误，拖累了整体进度。", b:"/ju hæv rɪˈpiːtɪdli/"}, {date:"07/15", type:"sentence", f:"The quality of your finished work cannot meet our basic requirements.", c:"你完成的工作质量完全达不到我们的基本要求。", b:"/ðə ˈkwɒləti/"}, {date:"07/15", type:"sentence", f:"It seems you haven’t taken this task seriously.", c:"看起来你从一开始就没有认真对待这项工作。", b:"/ɪt siːmz/"}, {date:"07/15", type:"sentence", f:"You need to pack up your stuff and leave now!", c:"现在马上收拾东西滚蛋。", b:"/ju niːd tu pæk ʌp/"},
        {date:"07/16", type:"sentence", f:"You never listen to what I’m actually feeling.", c:"你从来不肯认真听听我的真实感受。", b:"/ju ˈnevə ˈlɪsn/"}, {date:"07/16", type:"sentence", f:"It hurts when you brush off all my worries.", c:"你无视我所有烦恼，装作无关紧要，这让我很难过。", b:"/ɪt hɜːts/"}, {date:"07/16", type:"sentence", f:"Why do you always turn small disagreements into a big fight?", c:"为什么你总把一点小分歧闹成大争吵？", b:"/waɪ du ju/"}, {date:"07/16", type:"sentence", f:"I’m tired of making compromises while you never give in.", c:"我厌倦了一直妥协，而你从来不肯退让。", b:"/aɪm ˈtaɪəd/"}, {date:"07/16", type:"sentence", f:"Maybe we just aren’t right for each other at all.", c:"或许我们根本就不合适。", b:"/ˈmeɪbi wi/"},
        {date:"07/17", type:"sentence", f:"I can’t stand how selfish you are!", c:"我实在受不了你这么自私！", b:"/aɪ kɑːnt stænd/"}, {date:"07/17", type:"sentence", f:"Everything’s always about you, isn’t it?", c:"所有事永远都只围着你转，是吗？", b:"/ˈevriθɪŋz/"}, {date:"07/17", type:"sentence", f:"Why can’t you ever see how much you’ve hurt me?", c:"你怎么就看不到你把我伤得多深？", b:"/waɪ kɑːnt/"}, {date:"07/17", type:"sentence", f:"I’m so fed up with all your excuses!", c:"你的那些借口我听够了！", b:"/aɪm səʊ fed ʌp/"}, {date:"07/17", type:"sentence", f:"There’s nothing I can do if you see it like that.", c:"你这么看待这件事，我也没办法。", b:"/ðeəz ˈnʌθɪŋ/"},

        {date:"07/20", type:"sentence", f:"Every second with you makes my world feel complete.", c:"和你在一起的每一秒，都让我的世界变得完整。", b:"/ˈevri ˈsekənd/"}, {date:"07/20", type:"sentence", f:"I never knew I could fall for someone this deeply until I met you.", c:"遇见你之前，我从没想过会如此深爱一个人。", b:"/aɪ ˈnevə njuː/"}, {date:"07/20", type:"sentence", f:"You occupy every single thought in my mind all day long.", c:"我的脑海里整日全都是你。", b:"/ju ˈɒkjupaɪ/"}, {date:"07/20", type:"sentence", f:"Being with you is the sweetest thing I’ve ever experienced.", c:"和你相伴，是我经历过最美好的事。", b:"/ˈbiːɪŋ wɪð juː/"}, {date:"07/20", type:"sentence", f:"My heart only belongs to you, entirely and forever.", c:"我的心完完整整、永远只属于你。", b:"/maɪ hɑːt/"},
        {date:"07/21", type:"sentence", f:"Staying up late constantly undermines immune function and accelerates physical aging.", c:"长期熬夜会削弱免疫力，加速身体衰老。", b:"/ˈsteɪɪŋ ʌp leɪt/"}, {date:"07/21", type:"sentence", f:"Excessive alcohol intake causes irreversible damage to the liver and digestive system.", c:"过量饮酒会对肝脏和消化系统造成不可逆的损伤。", b:"/ɪkˈsesɪv ˈælkəhɒl/"}, {date:"07/21", type:"sentence", f:"Smoking for years hurts your lungs and increases heart disease risks.", c:"常年吸烟伤害肺部，提升心脏病患病概率。", b:"/ˈsməʊkɪŋ fɔː(r) jɪəz/"}, {date:"07/21", type:"sentence", f:"Working too hard without rest makes you tired and stressed easily.", c:"过度工作不休息会让人疲惫，容易焦虑。", b:"/ˈwɜːkɪŋ tuː hɑːd/"}, {date:"07/21", type:"sentence", f:"Taking junk food regularly leads to nutrient imbalance and metabolic disorders.", c:"长期食用垃圾食品会造成营养失衡，诱发代谢紊乱。", b:"/ˈteɪkɪŋ dʒʌŋk fuːd/"},
        {date:"07/22", type:"sentence", f:"I’m at a loss as to how to tackle this intricate issue.", c:"我完全不知道该如何处理这个复杂棘手的问题。", b:"/aɪm æt ə lɒs/"}, {date:"07/22", type:"sentence", f:"The profound experience broadens my horizons and reshapes my mindset.", c:"这段深刻的经历拓宽了我的眼界，重塑了我的思维。", b:"/ðə prəˈfaʊnd/"}, {date:"07/22", type:"sentence", f:"It is imperative that we strike a balance between ambition and reality.", c:"我们必须在理想抱负与现实之间找到平衡点。", b:"/ɪt ɪz ɪmˈperətɪv/"}, {date:"07/22", type:"sentence", f:"Numerous obstacles notwithstanding, he persisted in pursuing his ultimate aspiration.", c:"尽管困难重重，他依旧坚持追逐自己终极的理想。", b:"/ˈnjuːmərəs ˈɒbstəklz/"}, {date:"07/22", type:"sentence", f:"We ought to cherish every opportunity to cultivate comprehensive competence.", c:"我们应当珍惜每一次提升综合能力的机会。", b:"/wi ˈɔːt tuː ˈtʃerɪʃ/"},
        {date:"07/23", type:"sentence", f:"Rolls-Royce Phantom stands for unparalleled luxury and quiet majesty on the road.", c:"劳斯莱斯幻影代表着无与伦比的奢华与路上沉稳的王者气度。", b:"/rəʊlz rɔɪs ˈfæntəm/"}, {date:"07/23", type:"sentence", f:"McLaren pursues extreme aerodynamic performance and pure racing passion.", c:"迈凯轮追求极致空气动力学性能与纯粹的赛车热忱。", b:"/məkˈlærən pəˈsjuːz/"}, {date:"07/23", type:"sentence", f:"Nissan GT-R gains worldwide fame for amazing acceleration and reliable power output.", c:"日产GTR凭借惊人加速能力与稳定动力输出享誉全球。", b:"/ˈniːsɑːn ˌdʒiː tiː ˈɑː(r)/"}, {date:"07/23", type:"sentence", f:"Cadillac combines bold American styling with comfortable and premium riding experience.", c:"凯迪拉克融合美式大气设计与高级舒适的驾乘感受。", b:"/ˈkædəlæk kɒmbaɪnz/"}, {date:"07/23", type:"sentence", f:"Chevrolet carries classic American motor culture and focuses on practical driving fun.", c:"雪佛兰承载经典美式汽车文化，注重实用驾驶乐趣。", b:"/ˈʃevrəleɪ ˈkæriz/"},
        {date:"07/24", type:"sentence", f:"Lobster pasta features tender lobster meat mixed with rich creamy sauce.", c:"龙虾意面将鲜嫩龙虾肉搭配浓郁奶油酱汁。", b:"/ˈlɒbstə(r) ˈpɑːstə/"}, {date:"07/24", type:"sentence", f:"American steak delights diners with juicy texture and bold beef flavor.", c:"美式牛排以多汁口感与醇厚牛肉风味俘获食客。", b:"/əˈmerɪkən steɪk/"}, {date:"07/24", type:"sentence", f:"Pan-seared foie gras balances silky richness with subtle sweet notes.", c:"香煎鹅肝兼具绵密油脂感与淡淡的香甜气息。", b:"/pæn sɪəd ˈfwɑː ɡrɑː/"}, {date:"07/24", type:"sentence", f:"Otoro tuna offers incredibly soft flesh and mellow fatty taste.", c:"金枪鱼大腹肉质极其柔滑，脂香醇厚。", b:"/əʊˈtɔːrəʊ ˈtuːnə/"}, {date:"07/24", type:"sentence", f:"American smoked brisket turns tender after slow cooking with deep smoky aroma.", c:"美式烤牛胸肉经过慢烹变得软烂，带着浓郁烟熏香气。", b:"/əˈmerɪkən sməʊkt/"},
        {date:"07/25", type:"sentence", f:"He is generous and reliable, always ready to stand by others.", c:"他为人大方靠谱，十分够意思。", b:"/hi ɪz ˈdʒenərəs/"}, {date:"07/25", type:"sentence", f:"She has a broad mind and never cares about trivial gains and losses.", c:"他心胸敞亮，从不计较鸡毛算皮的得失。", b:"/ʃi hæz ə brɔːd/"}, {date:"07/25", type:"sentence", f:"He maintains an open mind and is willing to accept new viewpoints.", c:"他思想开放，愿意接纳不同的观点。", b:"/hi ˈmeɪnteɪnz/"}, {date:"07/25", type:"sentence", f:"He treats people sincerely and knows how to understand others.", c:"待人真诚，懂得体谅他人。", b:"/hi triːts ˈpiːpl/"}, {date:"07/25", type:"sentence", f:"Easy-going and warm-hearted, she gets along well with everyone.", c:"她随和热忱，很好相处。", b:"/ˈiːzi ɡəʊɪŋ/"},
        {date:"07/26", type:"sentence", f:"He is such an idiot who fails to think things through carefully.", c:"他就是个白痴，遇事从来不会仔细思考。", b:"/hi ɪz sʌtʃ ən/"}, {date:"07/26", type:"sentence", f:"He appears slow-witted and struggles to understand simple logic.", c:"他十分愚钝，连浅显的道理都难以理解。", b:"/hi əˈpɪəz/"}, {date:"07/26", type:"sentence", f:"He shows no conscience and never considers other people’s feelings.", c:"他毫无良心，从来不会顾及他人的感受。", b:"/hi ʃəʊz nəʊ/"}, {date:"07/26", type:"sentence", f:"He is incredibly stingy and refuses to share anything with others.", c:"他为人极度小气，不愿意和别人分享任何东西。", b:"/hi ɪz ɪnˈkredəbli/"}, {date:"07/26", type:"sentence", f:"He is a selfish jerk who always only cares about his own interests.", c:"他是个自私的混蛋，永远只在乎他的利益。", b:"/hi ɪz ə ˈselfɪʃ/"},
        {date:"07/27", type:"sentence", f:"I often relax on the sofa after work.", c:"下班后我经常在沙发上休息。", b:"/aɪ ˈɒfn rɪˈlæks/"}, {date:"07/27", type:"sentence", f:"The washing machine can finish all the laundry automatically.", c:"洗衣机可以自动洗完所有衣物。", b:"/ðə ˈwɒʃɪŋ məˈʃiːn/"}, {date:"07/27", type:"sentence", f:"The dishwasher saves plenty of time for housework.", c:"洗碗机节省大量做家务的时间。", b:"/ðə ˈdɪʃwɒʃə(r)/"}, {date:"07/27", type:"sentence", f:"The vacuum cleaner makes cleaning the floor much easier.", c:"吸尘器让打扫地面轻松很多。", b:"/ðə ˈvækjuəm/"}, {date:"07/27", type:"sentence", f:"I put all my coats neatly inside the wardrobe.", c:"我把所有外套整齐收进衣柜。", b:"/aɪ pʊt ɔːl maɪ/"},
        {date:"07/28", type:"sentence", f:"Growth often emerges from struggles that we once feared would break us.", c:"成长往往诞生于那些我们曾惧怕会将自己击垮的困境。", b:"/ɡrəʊθ ˈɒfn ɪˈmɜːdʒɪz/"}, {date:"07/28", type:"sentence", f:"True happiness lies not in chasing endless desires, but in appreciating what we already possess.", c:"真正的幸福不在于追逐无尽欲望，而在于珍惜当下所拥有的一切。", b:"/truː ˈhæpinəs laɪz/"}, {date:"07/28", type:"sentence", f:"Time does not heal wounds automatically; it offers us chances to learn how to reconcile with the past.", c:"时间不会自动抚平伤痛，它只是给予我们机会，学会与过往和解。", b:"/taɪm dʌz nɒt hiːl/"}, {date:"07/28", type:"sentence", f:"The path toward dreams is rarely straight, yet every detour shapes who we are meant to become.", c:"通往理想的道路鲜有坦途，但每一段弯路都在塑造未来的自己。", b:"/ðə pɑːθ təˈwɔːd/"}, {date:"07/28", type:"sentence", f:"We cannot control all events in life, but we are always capable of choosing our attitude toward them.", c:"我们无法掌控人生所有际遇，却永远有权选择面对世事的心态。", b:"/wi ˈkænɒt kənˈtrəʊl/"},
        {date:"07/29", type:"sentence", f:"I still miss us, but I know we can’t keep going.", c:"我还是怀念曾经的我们，但清楚我们走不下去了。", b:"/aɪ stɪl mɪs ʌs/"}, {date:"07/29", type:"sentence", f:"It hurts to think we ended up like this after everything we’ve been through.", c:"一同经历了那么多，最后却落得这个结局，心里很难受。", b:"/ɪt hɜːts tuː θɪŋk/"}, {date:"07/29", type:"sentence", f:"I don’t hate you. I just feel sad for what we could have had.", c:"我不恨你，只是为我们本该拥有的一切感到惋惜。", b:"/aɪ dəʊnt heɪt juː/"}, {date:"07/29", type:"sentence", f:"All those good times are still fresh in my mind, yet we’re strangers now.", c:"那些美好的回忆依旧清晰，可我们如今形同陌路。", b:"/ɔːl ðəʊz ɡʊd taɪmz/"}, {date:"07/29", type:"sentence", f:"I wish things could’ve worked out between us, but it’s too late now.", c:"多希望我们能有结果，只是一切都太迟了。", b:"/aɪ wɪʃ θɪŋz/"},
        {date:"07/30", type:"sentence", f:"Could you tell me how to get to this place?", c:"你能告诉我怎么去这个地方吗？", b:"/kʊd ju tel mi/"}, {date:"07/30", type:"sentence", f:"Which direction should I head for the subway station?", c:"去地铁站应该往哪个方向走？", b:"/wɪtʃ dəˈrekʃn/"}, {date:"07/30", type:"sentence", f:"Is it far from here on foot?", c:"步行过去离这儿远吗？", b:"/ɪz ɪt fɑː(r)/"}, {date:"07/30", type:"sentence", f:"Do I need to take a bus or walk straight ahead?", c:"我需要坐公交还是一直往前走？", b:"/duː aɪ niːd tu/"}, {date:"07/30", type:"sentence", f:"Excuse me, can you show me the way on the map?", c:"打扰一下，你能在地图上指一下路线吗？", b:"/ɪkˈskjuːz mi/"},
        {date:"07/31", type:"sentence", f:"Wealth seldom comes effortlessly; persistent efforts are the price we pay for a stable life.", c:"财富很少唾手可得，持久的付出是我们换取安稳生活的代价。", b:"/welθ ˈseldəm/"}, {date:"07/31", type:"sentence", f:"Few people can reap financial rewards without enduring countless hardships and frustrations.", c:"很少有人不必历经无数艰辛与挫败，就能收获经济上的回报。", b:"/fjuː ˈpiːpl kæn/"}, {date:"07/31", type:"sentence", f:"Every penny earned honestly carries the weight of unseen toil and silent perseverance.", c:"每一分踏实挣来的钱，都承载着不为人知的辛劳与默默坚持。", b:"/ˈevri ˈpeni/"}, {date:"07/31", type:"sentence", f:"Material gains are never granted freely, and one must overcome obstacles to secure a decent income.", c:"物质回报从不会凭空降临，人必须跨越重重阻碍，才能获得可观的收入。", b:"/məˈtɪəriəl ɡeɪnz/"}, {date:"07/31", type:"sentence", f:"It is widely acknowledged that building solid finances demands constant struggle rather than luck.", c:"众所周知，积累可观的财富依靠持续拼搏，而非运气。", b:"/ɪt ɪz ˈwaɪdli/"},
        {date:"08/01", type:"word", f:"lipstick", c:"口红", b:"/ˈlɪpstɪk/"}, {date:"08/01", type:"word", f:"foundation", c:"粉底液", b:"/faʊnˈdeɪʃn/"}, {date:"08/01", type:"word", f:"dishwasher", c:"洗碗机", b:"/ˈdɪʃwɒʃə(r)/"}, {date:"08/01", type:"word", f:"microwave", c:"微波炉", b:"/ˈmaɪkrəweɪv/"}, {date:"08/01", type:"word", f:"mango", c:"芒果", b:"/ˈmæŋɡəʊ/"}, {date:"08/01", type:"word", f:"durian", c:"榴莲", b:"/ˈdʊəriən/"}, {date:"08/01", type:"word", f:"cheesecake", c:"芝士蛋糕", b:"/ˈtʃiːzkeɪk/"}, {date:"08/01", type:"word", f:"muffin", c:"玛芬蛋糕", b:"/ˈmʌfɪn/"}, {date:"08/01", type:"word", f:"macaron", c:"马卡龙", b:"/ˌmækəˈrɒn/"}, {date:"08/01", type:"word", f:"pudding", c:"布丁", b:"/ˈpʊdɪŋ/"},
        {date:"08/02", type:"word", f:"cheesecake", c:"芝士蛋糕", b:"/ˈtʃiːzkeɪk/"}, {date:"08/02", type:"word", f:"jelly", c:"果冻", b:"/ˈdʒeli/"}, {date:"08/02", type:"word", f:"tiramisu", c:"提拉米苏", b:"/ˌtɪrəmɪˈsuː/"}, {date:"08/02", type:"word", f:"cookie", c:"饼干", b:"/ˈkʊki/"}, {date:"08/02", type:"word", f:"waffle", c:"华夫饼", b:"/ˈwɒfl/"}, {date:"08/02", type:"word", f:"ice-cream", c:"冰淇淋", b:"/ˌaɪs ˈkriːm/"}, {date:"08/02", type:"word", f:"donut", c:"甜甜圈", b:"/ˈdəʊnʌt/"}, {date:"08/02", type:"word", f:"mousse", c:"慕斯", b:"/muːs/"}, {date:"08/02", type:"word", f:"croissant", c:"可颂", b:"/ˈkrwɑːsɒnt/"}, {date:"08/02", type:"word", f:"cupcake", c:"纸杯蛋糕", b:"/ˈkʌpkeɪk/"},
        {date:"08/03", type:"sentence", f:"She put on her lipstick before going out to buy some fruit.", c:"她涂好口红，出门去买一些水果。", b:"/ʃi pʊt ɒn/"}, {date:"08/03", type:"sentence", f:"I often use the microwave to heat my muffin for breakfast.", c:"我经常用微波炉加热玛芬蛋糕当早餐。", b:"/aɪ ˈɒfn juːz/"}, {date:"08/03", type:"sentence", f:"This creamy cheesecake is my favorite after-meal dessert.", c:"这款绵密的芝士蛋糕是我最爱的饭后甜品。", b:"/ðɪs ˈkriːmi/"}, {date:"08/03", type:"sentence", f:"The dishwasher frees me from washing piles of dirty bowls.", c:"洗碗机让我不用去洗一大堆脏碗。", b:"/ðə ˈdɪʃwɒʃə(r)/"}, {date:"08/03", type:"sentence", f:"Durian has a strong smell but many people enjoy its taste.", c:"榴莲气味浓烈，但很多人很喜欢它的味道。", b:"/ˈdʊəriən hæz/"},
        {date:"08/04", type:"sentence", f:"I plan to work out at the gym to build up my physical strength today.", c:"我今天打算去健身房健身，增强自身体力。", b:"/aɪ plæn tuː/"}, {date:"08/04", type:"sentence", f:"I intend to enjoy a cup of fragrant tea to calm my mood today.", c:"我今天要品一杯香茶，平复自己的心情。", b:"/aɪ ɪnˈtend tuː/"}, {date:"08/04", type:"sentence", f:"I am going to have a few drinks to relax myself with my pals today.", c:"我今天要和小酌几杯，放松一下自己。", b:"/aɪ æm ˈɡəʊɪŋ tuː/"}, {date:"08/04", type:"sentence", f:"I decide to hike up the mountain to appreciate the natural scenery today.", c:"我今天决定去爬山，欣赏自然风光。", b:"/aɪ dɪˈsaɪd tuː/"}, {date:"08/04", type:"sentence", f:"I will head for tourist attractions and take some memorable photos today.", c:"我今天会前往景点，拍下一些有纪念意义的照片。", b:"/aɪ wɪl hed fɔː(r)/"},
        {date:"08/05", type:"sentence", f:"Life is full of small difficulties.", c:"生活充满小小的困境。", b:"/laɪf ɪz fʊl əv smɔːl ˈdɪfɪkəltiz/"}, {date:"08/05", type:"sentence", f:"We cannot always have good luck.", c:"我们不会总是拥有好运。", b:"/wi ˈkænɒt ˈɔːlweɪz hæv ɡʊd lʌk/"}, {date:"08/05", type:"sentence", f:"When we meet trouble, do not be too sad.", c:"当遇到麻烦时，不要太过难过。", b:"/wen wi miːt ˈtrʌbl duː nɒt biː tuː sæd/"}, {date:"08/05", type:"sentence", f:"It is better to keep an optimistic heart.", c:"保持一颗乐观的心会更好。", b:"/ɪt ɪz ˈbetə tuː kiːp æn ˌɒptɪˈmɪstɪk hɑːt/"}, {date:"08/05", type:"sentence", f:"Smile at your life and face problems bravely.", c:"对生活微笑，勇敢面对难题。", b:"/smaɪl æt jɔː laɪf ænd feɪs ˈprɒbləmz ˈbreɪvli/"}, {date:"08/05", type:"sentence", f:"Bad days will pass.", c:"糟糕的日子总会过去。", b:"/bæd deɪz wɪl pɑːs/"}, {date:"08/05", type:"sentence", f:"If we stay positive, we can find happiness around us.", c:"如果我们保持正能量，就能发现身边的快乐。", b:"/ɪf wi steɪ ˈpɒzətɪv wi kæn faɪnd ˈhæpinəs əˈraʊnd ʌs/"}, {date:"08/05", type:"sentence", f:"Never give up and believe in yourself.", c:"永不放弃，相信你自己。", b:"/ˈnevə ɡɪv ʌp ænd bɪˈliːv ɪn jɔːˈself/"}
    ];

    let currentList = [];
    let currentIndex = 0;

    function init() {
        const dateSelect = document.getElementById('dateSelect');
        const dates = [...new Set(data.map(item => item.date))];
        dates.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            dateSelect.appendChild(opt);
        });
        updateFilters();
    }

    function updateFilters() {
        render();
    }

    function render() {
        const mode = document.getElementById('mode').value;
        const date = document.getElementById('dateSelect').value;

        currentList = data.filter(item => {
            const matchMode = mode === 'all' || item.type === mode;
            const matchDate = date === 'all' || item.date === date;
            return matchMode && matchDate;
        });

        currentIndex = 0;
        showCard();
    }

    function showCard() {
        const card = document.querySelector('.card');
        card.classList.remove('flipped');
        
        if (currentList.length === 0) {
            document.getElementById('date-display').innerText = "";
            document.getElementById('front-text').innerText = "暂无数据";
            document.getElementById('front-cn').innerText = "";
            document.getElementById('back-text').innerText = "";
            return;
        }

        const item = currentList[currentIndex];
        document.getElementById('date-display').innerText = `[${item.date}] (${currentIndex + 1}/${currentList.length})`;
        document.getElementById('front-text').innerText = item.f;
        document.getElementById('front-cn').innerText = item.c;
        document.getElementById('back-text').innerText = item.b;
    }

    function next() {
        if (currentList.length === 0) return;
        currentIndex = (currentIndex + 1) % currentList.length;
        showCard();
    }

    function playAudio() {
        if (currentList.length === 0) return;
        const item = currentList[currentIndex];
        const utterance = new SpeechSynthesisUtterance(item.f);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }

    init();
</script>

</html>
