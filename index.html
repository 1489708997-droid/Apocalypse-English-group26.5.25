<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习系统</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f4f4f9; }
        .card { width: 90%; max-width: 400px; height: 250px; background: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; cursor: pointer; transition: 0.3s; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 10px; background: #4a90e2; color: white; font-size: 16px; }
    </style>
</head>
<body>

<div class="card" onclick="flipCard()">
    <div id="display">点击开始学习</div>
</div>

<div class="controls">
    <button onclick="prev()">上一条</button>
    <button onclick="next()">下一条</button>
</div>

<script>
    // 您的数据全部放在这里
    const data = [
        {front: "abandon", back: "抛弃 /əˈbændən/"},
        {front: "achieve", back: "实现 /əˈtʃiːv/"},
        {front: "Every effort pays off.", back: "努力终有回报。"}
    ];

    let i = 0;
    let showFront = true;

    function flipCard() {
        showFront = !showFront;
        document.getElementById('display').innerText = showFront ? data[i].front : data[i].back;
    }

    function next() { i = (i + 1) % data.length; showFront = true; document.getElementById('display').innerText = data[i].front; }
    function prev() { i = (i - 1 + data.length) % data.length; showFront = true; document.getElementById('display').innerText = data[i].front; }

    document.getElementById('display').innerText = data[0].front;
</script>
</body>
</html>
